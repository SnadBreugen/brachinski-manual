<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRACHINSKI // MANUAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0604; --panel:#17100a; --panel2:#1f1710;
  --ink:#f8eed8; --dim:#d9c9a4; --dimmer:#a1906e;
  --amber:#f2a81e; --amber-hi:#ffc869;
  --line:#5a4526; --line-hi:#8a6a2e;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --wordmark:"Anton",Impact,sans-serif;
  --col:1560px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--dim);
  font-family:var(--mono);font-size:14px;line-height:1.7}
body{padding:0 0 110px}
a{color:var(--amber)}

.top{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:var(--col);margin:0 auto;padding:18px 24px 0}
.mark{font-family:var(--wordmark);font-size:40px;letter-spacing:1px;color:var(--ink);line-height:1}
.mark span{color:var(--amber)}
.sub{font-size:11px;letter-spacing:4px;color:var(--dimmer);margin:6px 0 16px}
nav{display:flex;flex-wrap:wrap;gap:2px}
nav button{font:inherit;font-size:12px;letter-spacing:2px;color:var(--dim);background:none;
  border:1px solid transparent;border-bottom:none;padding:9px 16px;cursor:pointer;border-radius:5px 5px 0 0}
nav button:hover{color:var(--ink);background:var(--panel)}
nav button[aria-selected=true]{color:var(--bg);background:var(--amber);font-weight:700}
nav button:focus-visible{outline:2px solid var(--amber-hi);outline-offset:-3px}

main{max-width:var(--col);margin:0 auto;padding:34px 24px 0}
section[hidden]{display:none}
h2{font-family:var(--wordmark);font-size:30px;letter-spacing:1px;color:var(--ink);margin:0 0 4px;font-weight:400}
.lede{max-width:72ch;margin:0 0 34px;color:var(--dimmer)}

/* the picture and the two ways of labelling it */
.fig{position:relative;display:grid;gap:0 46px;align-items:start}
.fig.wide{grid-template-columns:1fr 54% 1fr}
.fig.narrow{grid-template-columns:1fr}
.gut{position:relative}
.fig.narrow .gut{display:none}
.mid{position:relative;border:1px solid var(--line);border-radius:6px;background:#000;overflow:hidden}
.mid img{display:block;width:100%;height:auto}
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fig.narrow .leads{display:none}
.leads path{fill:none;stroke:var(--line-hi);stroke-width:1}
.leads path.on{stroke:var(--amber);stroke-width:1.6}

/* the marker that sits on the part, in both states */
.spot{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:700;line-height:1;
  background:var(--amber);color:#140c04;border-radius:50%;
  width:7px;height:7px;text-indent:-999em;overflow:hidden;
  box-shadow:0 0 0 2px rgba(10,6,4,.75)}
.fig.narrow .spot{width:21px;height:21px;text-indent:0;line-height:21px;text-align:center}
.spot:hover,.spot.on{background:var(--ink);box-shadow:0 0 0 3px rgba(242,168,30,.4)}
.spot:focus-visible{outline:2px solid var(--amber-hi);outline-offset:3px}

.note{width:100%}
.fig.wide .gut.placed .note{position:absolute}
.fig.wide .gut.left .note{text-align:right}
.note h3{margin:0;font-size:12px;letter-spacing:2.5px;color:var(--amber);font-weight:700;line-height:1.5}
.note p{margin:2px 0 0;font-size:12.5px;line-height:1.55;color:var(--dim)}
.note.on h3{color:var(--ink)}
.note.on p{color:var(--ink)}

/* narrow: a numbered key under the picture, the way a paper manual does it */
.keys{display:none;margin:26px 0 0;padding:0;list-style:none}
.fig.narrow + .keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 34px}
.keys li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;
  padding:12px 0;border-top:1px solid var(--panel2)}
.keys li.on{border-top-color:var(--amber)}
.keys b{width:21px;height:21px;border-radius:50%;border:1px solid var(--amber);color:var(--amber);
  font-size:11px;font-weight:700;line-height:19px;text-align:center}
.keys li.on b{background:var(--amber);color:#140c04}


.steps{list-style:none;margin:0;padding:0;
  columns:2;column-gap:52px}
.steps li{break-inside:avoid;margin:0 0 22px;padding:0 0 4px}
.steps h3{margin:0 0 3px;font-size:13px;letter-spacing:2.5px;color:var(--amber);font-weight:700}
.steps p{margin:0;font-size:13px;line-height:1.65;max-width:56ch}
@media (max-width:900px){.steps{columns:1}}
.map{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px}
.map svg{display:block;width:100%;height:auto}
.m-box{fill:var(--panel2);stroke:var(--line-hi);stroke-width:1.5}
.m-hub{fill:#20170d;stroke:var(--amber);stroke-width:2}
.m-dash{fill:none;stroke:var(--line-hi);stroke-width:1.5;stroke-dasharray:5 4}
.m-t{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:2.5px;fill:var(--ink)}
.m-s{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;fill:var(--dimmer)}
.m-big{font-family:var(--wordmark);font-size:30px;letter-spacing:1px;fill:var(--amber)}
.m-cap{font-family:var(--mono);font-size:10px;letter-spacing:3px;fill:var(--dimmer)}
.m-flow{fill:none;stroke:var(--amber);stroke-width:1.6}
.m-bus{fill:none;stroke:var(--line-hi);stroke-width:1.2}

.setter{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--amber);padding:12px 24px}
.setter[hidden]{display:none}
.setter .in{max-width:var(--col);margin:0 auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.setter textarea{flex:1 1 460px;min-height:78px;background:var(--bg);color:var(--dim);font:inherit;
  font-size:12px;border:1px solid var(--line);border-radius:5px;padding:9px 11px;resize:vertical}
.btn{font:inherit;font-size:12px;letter-spacing:2px;color:var(--amber);background:var(--panel2);
  border:1px solid var(--amber);border-radius:5px;padding:9px 15px;cursor:pointer}
.btn:hover{background:var(--amber);color:#140c04}
.mid.setting{cursor:crosshair}
.mid.setting img{opacity:.8}

.foot{max-width:var(--col);margin:64px auto 0;padding:18px 24px 0;border-top:1px solid var(--panel2);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:11px;letter-spacing:2px;color:var(--dimmer)}

@media (max-width:760px){ .mark{font-size:30px} main{padding:24px 16px 0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <div class="mark">BRACHINSKI<span> // MANUAL</span></div>
    <div class="sub">SNAD INDUSTRIES</div>
    <nav id="tabs" role="tablist"></nav>
  </div>
</header>

<main id="main"></main>

<div class="foot">
  <span>MANUAL REV 002 · shot on REV 969</span>
  <span><a href="https://snadbreugen.github.io/Brachinski/">open the machine</a></span>
</div>

<div class="setter" id="setter" hidden>
  <div class="in">
    <div style="flex:0 0 200px">
      <div style="color:var(--amber);font-weight:700;letter-spacing:2px">POINT SETTER</div>
      <div style="font-size:11px">click the picture, the line lands in the box. paste it back to me.</div>
    </div>
    <textarea id="out" readonly placeholder="nothing set yet"></textarea>
    <button class="btn" id="copyOut">COPY</button>
    <button class="btn" id="clearOut">CLEAR</button>
    <button class="btn" id="closeSet">CLOSE</button>
  </div>
</div>

<script>
// x and y are percentages of the picture :: press s to set new ones
// s:"L" or "R" forces which margin a callout parks on, otherwise it follows x
const VIEWS = [
  { id:"map", title:"Signal map", lede:"Where a sound comes from and where it ends up." },

  { id:"start", title:"Getting started", steps:[
      ["1 · PICK A KIT","Six sound sets, each with its own synthesis engine. DRUM 1 and DRUM 2 are full kits: kick, snare, hats, toms. PERC 1 and PERC 2 hold no kick and no snare, only the things in between. KICK LAB and RIM LAB were built by Sumad, one sound each, every parameter open. Step through them with the arrows. Nothing here is sampled: every hit is calculated while it plays."],
      ["2 · SHAPE THE SOUND","Click a voice in the grid, then work the editor. PARAMS build the body, FX dirty it up. SET moves a knob on all nine voices at once. Ctrl-drag a voice onto another to copy its sound."],
      ["3 · SUMAD'S DRUM LAB","Two workbenches next to the kits, each for one sound taken apart. KICK LAB gives you the pitch drop of a kick in stages · CLICK.F is the top of the sweep, PUNCH.F the middle, TUNE where it lands, so you hear what each part contributes. RIMSHOT LAB does the same for a rim hit: three tuned resonators plus noise, two versions side by side. Both have their own sequencer tracks and their own patterns, kept apart from everything else · build a sound, write a figure, then right-click PATTERN to take it into YOUR KIT."],
      ["4 · WRITE THE PATTERN","Tap a step: on, again for accent, again for off. Drag a step up or down for fine velocity, alt and the wheel for ratchets. Eight patterns per kit, up to four bars each."],
      ["5 · P-LOCK · PER-STEP VALUES","Tap a knob without turning it and the step grid switches to that parameter. Now every step can hold its own value · drag one up or down and only that hit gets a different filter, decay or pitch. This is where a flat loop starts to move: one open hat brighter than the rest, one kick tuned down. Tap the knob again to leave the mode."],
      ["6 · SET THE FEEL","PLAY runs the loop. BPM and SWING carry the groove. REC plus a knob turn while it plays records automation."],
      ["7 · LOOK AND FEEL","BG runs a background animation driven by what you play · it reacts to your hits and changes nothing in the sound. FX picks its colour, SKIN the look of the chassis. TEXT hides these explanation panels when you no longer need them, HIDE clears the frame entirely for a full-screen view. All of it is cosmetic · nothing here touches what you hear."],
      ["8 · YOUR KIT","YOUR KIT is your own workbench, and it starts empty. Pull sounds in from any kit, load your own samples straight into a slot with a right-click, or right-click PATTERN in a kit to bring a whole pattern across. Fifteen slots. The four kits are made for everyone; this one is only yours."],
      ["9 · GROUP AND TREAT","Select slots with shift, CTRL+G makes them a group. A group carries its own patterns and its own effect chain · right-click a row for GROUP FX."],
      ["10 · THE SUM","Everything meets on the master. MASTER FX is the chain over the whole mix · distortion, filter, delay, reverb, resonator, glitch, rumble. The FINALIZER underneath is the last stage: pick a character like GLUE, PUNCH or WARM instead of setting a compressor by hand. LIMIT catches whatever still peaks. Work here last, once the parts already sit together."],
      ["11 · MIDI CONTROL","Right-click any knob and pick MIDI LEARN, then move a control on your hardware · the two are linked from then on. The knob catches up smoothly instead of jumping, so nothing lurches when you take over a moving value. Map the handful of things you actually reach for while playing: filter, decay, the group effects. Right-click again to clear it."],
      ["12 · KEEP IT","SAVE KIT writes a file with the sounds, every pattern, the effects and the look. LOAD KIT reads it back, or just drop the file onto the window."],
      ["13 · TAKE IT TO AUDIOTOOL","Connect with UPLINK first. EXPORT sends the whole set into Audiotool as a playable Machiniste: every voice becomes its own one-shot and the steps are written into its pattern, so you arrive with nine separate channels still open to mixing. One-shots are dry, though. If your sound leans on reverb or delay, export a loop into the timeline instead, so the tail comes with it. It goes the other way too: audio sitting in your Audiotool timeline can be pulled straight into a live loop track, with no export and no download. EXPORT WAV is the third route, for any other DAW."]
    ], lede:"Thirteen steps from an empty screen to a track in Audiotool." },

// keep a column of callouts in order and never let two of them touch
// wants and heights come in sorted by want :: the column may end lower than the picture, that is fine
function stackTops(wants,heights,gap){
  const n=wants.length, top=new Array(n);
  let cur=0;
  for(let i=0;i<n;i++){ top[i]=Math.max(wants[i],cur); cur=top[i]+heights[i]+gap; }
  for(let i=n-1;i>0;i--){                                                      // pull each one back up as far as its neighbour allows
    const room=top[i]-heights[i-1]-gap;
    if(top[i-1]>room)top[i-1]=room;
  }
  if(n&&top[0]<0){                                                             // the whole column slid above the top edge, push it back down
    const push=-top[0];
    for(let i=0;i<n;i++)top[i]+=push;
    for(let i=1;i<n;i++)top[i]=Math.max(top[i],top[i-1]+heights[i-1]+gap);
  }
  return top;
}
// two leader lines cross when their callouts sit in a different order than their anchors
// the stubs at the column edge are short, so the sloping part decides it
function segCross(a,b){
  const d=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
  const s1=Math.sign(d(a.p,a.q,b.p)), s2=Math.sign(d(a.p,a.q,b.q));
  const s3=Math.sign(d(b.p,b.q,a.p)), s4=Math.sign(d(b.p,b.q,a.q));
  return s1!==s2 && s3!==s4 && s1!==0 && s2!==0 && s3!==0 && s4!==0;
}
function countCross(segs){
  let n=0;
  for(let i=0;i<segs.length;i++)for(let j=i+1;j<segs.length;j++)if(segCross(segs[i],segs[j]))n++;
  return n;
}
function unknot(list,build){                                                   // swap neighbours as long as it buys fewer crossings
  let best=countCross(build(list)), guard=0;
  while(best>0&&guard++<40){
    let moved=false;
    for(let i=0;i<list.length-1;i++){
      const t=list.slice(); const x=t[i]; t[i]=t[i+1]; t[i+1]=x;
      const c=countCross(build(t));
      if(c<best){ best=c; list=t; moved=true; }
    }
    if(!moved)break;
  }
  return list;
}
const NS="http://www.w3.org/2000/svg";
const main=document.getElementById("main"), tabs=document.getElementById("tabs");
const WIDE_AT=1180;
let setting=false;

const el=(t,a,h)=>{const n=document.createElement(t);
  if(a)for(const k in a)n.setAttribute(k,a[k]); if(h!=null)n.innerHTML=h; return n;};
const svgEl=(t,a,txt)=>{const n=document.createElementNS(NS,t);
  if(a)for(const k in a)n.setAttribute(k,a[k]); if(txt!=null)n.textContent=txt; return n;};

VIEWS.forEach((v,i)=>{
  const b=el("button",{role:"tab","aria-selected":i===0?"true":"false"},
    v.id==="map"?"MAP":v.title.toUpperCase());
  b.onclick=()=>show(v.id);
  tabs.appendChild(b);
  const s=el("section",{id:"p-"+v.id,role:"tabpanel"});
  if(i)s.hidden=true;
  s.appendChild(el("h2",null,v.title));
  s.appendChild(el("p",{class:"lede"},v.lede));
  if(v.id==="map")s.appendChild(buildMap());
  else if(v.steps)s.appendChild(buildSteps(v));
  else buildPlate(v).forEach(n=>s.appendChild(n));
  main.appendChild(s);
});

function show(id){
  VIEWS.forEach((v,i)=>{
    const on=(v.id===id);
    document.getElementById("p-"+v.id).hidden=!on;
    tabs.children[i].setAttribute("aria-selected",on?"true":"false");
    if(on&&v._draw)requestAnimationFrame(v._draw);
  });
  window.scrollTo({top:0});
}

function buildSteps(v){
  const ol=el("ol",{class:"steps"});
  v.steps.forEach(([head,body])=>{
    const li=el("li");
    li.appendChild(el("h3",null,head));
    li.appendChild(el("p",null,body));
    ol.appendChild(li);
  });
  return ol;
}
function buildPlate(v){
  const fig=el("div",{class:"fig narrow"});
  const gl=el("div",{class:"gut left"}), gr=el("div",{class:"gut right"});
  const mid=el("div",{class:"mid"});
  const img=el("img",{src:v.img,alt:v.title});
  const svg=svgEl("svg",{class:"leads"});
  mid.appendChild(img);
  fig.appendChild(gl); fig.appendChild(mid); fig.appendChild(gr); fig.appendChild(svg);
  const keys=el("ul",{class:"keys"});

  v.notes.forEach((n,i)=>{
    n.side=n.s||(n.x<50?"L":"R");
    n.n=i+1;

    const spot=el("button",{class:"spot",style:"left:"+n.x+"%;top:"+n.y+"%",
      title:n.k,"aria-label":n.k},String(n.n));
    spot.onmouseenter=()=>mark(v,i,true);
    spot.onmouseleave=()=>mark(v,i,false);
    spot.onfocus=()=>mark(v,i,true);
    spot.onblur=()=>mark(v,i,false);
    mid.appendChild(spot);
    n._spot=spot;

    const note=el("div",{class:"note"});
    note.appendChild(el("h3",null,n.k));
    note.appendChild(el("p",null,n.t));
    note.onmouseenter=()=>mark(v,i,true);
    note.onmouseleave=()=>mark(v,i,false);
    n._note=note;
    (n.side==="L"?gl:gr).appendChild(note);

    const li=el("li");
    li.appendChild(el("b",null,String(n.n)));
    const d=el("div");
    d.appendChild(el("h3",null,n.k));
    d.appendChild(el("p",null,n.t));
    li.appendChild(d);
    li.onmouseenter=()=>mark(v,i,true);
    li.onmouseleave=()=>mark(v,i,false);
    n._li=li;
    keys.appendChild(li);
  });

  function draw(){
    const F=fig.getBoundingClientRect();
    const roomy=F.width>=WIDE_AT&&img.complete&&img.naturalWidth>0;
    fig.classList.toggle("wide",roomy);
    fig.classList.toggle("narrow",!roomy);
    if(!roomy){ gl.classList.remove("placed"); gr.classList.remove("placed"); return; }

    const I=img.getBoundingClientRect();
    if(!I.height)return;
    const ox=I.left-F.left, oy=I.top-F.top;

    // each callout wants to sit level with its part, then they push each other apart
    const place=(list,side)=>{
      list.forEach(n=>{ n._h=n._note.offsetHeight;
        n._want=oy+(n.y/100)*I.height-n._h/2; });
      const dir=side==="L"?1:-1;
      list.sort((a,b)=>(a._want-b._want)||dir*(a.x-b.x));                      // same height :: the nearer anchor goes to the upper callout
      const colX=side==="L"?(gl.getBoundingClientRect().right-F.left)
                           :(gr.getBoundingClientRect().left-F.left);
      const build=order=>{
        const tops=stackTops(order.map(n=>n._want),order.map(n=>n._h),14);
        return order.map((n,i)=>({
          p:{x:colX+(side==="L"?18:-18), y:tops[i]+n._h/2},
          q:{x:ox+(n.x/100)*I.width, y:oy+(n.y/100)*I.height}}));
      };
      list=unknot(list,build);
      const tops=stackTops(list.map(n=>n._want),list.map(n=>n._h),14);
      list.forEach((n,i)=>{ n._top=tops[i]; n._note.style.top=tops[i]+"px"; });
      return list;
    };
    gl.classList.add("placed"); gr.classList.add("placed");
    place(v.notes.filter(n=>n.side==="L"),"L");
    place(v.notes.filter(n=>n.side==="R"),"R");

    svg.setAttribute("viewBox","0 0 "+F.width+" "+F.height);
    svg.innerHTML="";
    v.notes.forEach((n,i)=>{
      const ax=ox+(n.x/100)*I.width, ay=oy+(n.y/100)*I.height;
      const R=n._note.getBoundingClientRect();
      const ty=R.top-F.top+R.height/2;
      const tx=n.side==="L"?(R.right-F.left+8):(R.left-F.left-8);
      const bend=n.side==="L"?tx+18:tx-18;
      svg.appendChild(svgEl("path",{d:"M"+tx+" "+ty+" H"+bend+" L"+ax+" "+ay,"data-i":i}));
    });
  }
  v._draw=draw;
  img.addEventListener("load",draw);
  if(window.ResizeObserver)new ResizeObserver(draw).observe(fig);
  addEventListener("resize",draw);
  requestAnimationFrame(draw);

  mid.addEventListener("click",e=>{
    if(!setting)return;
    const r=img.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width*100).toFixed(1);
    const y=((e.clientY-r.top)/r.height*100).toFixed(1);
    const box=document.getElementById("out");
    box.value+=(box.value?"\n":"")+'{x:'+x+',y:'+y+', s:"", k:"", t:""}   // '+v.id;
    box.scrollTop=box.scrollHeight;
  });

  return [fig,keys];
}

function mark(v,i,on){
  const n=v.notes[i];
  n._note.classList.toggle("on",on);
  n._li.classList.toggle("on",on);
  n._spot.classList.toggle("on",on);
  const s=document.getElementById("p-"+v.id);
  s.querySelectorAll('.leads [data-i="'+i+'"]').forEach(p=>p.classList.toggle("on",on));
}

function buildMap(){
  const box=el("div",{class:"map"});
  const svg=svgEl("svg",{viewBox:"0 0 1360 520"});                             // the drawing runs to 1300 wide and 470 deep, plus a margin
  const add=(t,a,txt)=>{const n=svgEl(t,a,txt); svg.appendChild(n); return n;};
  add("defs",{}).innerHTML='<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--amber)"/></marker>';

  const COLW=200, GAP=60, X=i=>60+i*(COLW+GAP), MID=250;

  [["KIT 1","drum kit"],["KIT 2","drum kit"],["KIT 3","percussion"],["KIT 4","percussion"]]
  .forEach(([a,b],i)=>{
    const y=96+i*58;
    add("rect",{class:"m-box",x:X(0),y:y,width:COLW,height:46,rx:6});
    add("text",{class:"m-t",x:X(0)+16,y:y+20},a);
    add("text",{class:"m-s",x:X(0)+16,y:y+36},b);
    add("path",{class:"m-bus",d:"M"+(X(0)+COLW)+" "+(y+23)+" H"+(X(0)+COLW+GAP/2)});
  });
  const labY=96+4*58+22;
  add("rect",{class:"m-dash",x:X(0),y:labY,width:COLW,height:46,rx:6});
  add("text",{class:"m-t",x:X(0)+16,y:labY+20},"DRUM LAB");
  add("text",{class:"m-s",x:X(0)+16,y:labY+36},"kick + rimshot");
  add("path",{class:"m-bus",d:"M"+(X(0)+COLW)+" "+(labY+23)+" H"+(X(0)+COLW+GAP/2)});
  add("path",{class:"m-bus",d:"M"+(X(0)+COLW+GAP/2)+" 119 V"+(labY+23)});
  add("text",{class:"m-cap",x:X(0),y:74},"SOUNDS");

  add("path",{class:"m-flow",d:"M"+(X(0)+COLW+GAP/2)+" "+MID+" H"+(X(1)-6),"marker-end":"url(#ar)"});
  add("rect",{class:"m-box",x:X(1),y:MID-27,width:COLW,height:54,rx:6});
  add("text",{class:"m-t",x:X(1)+16,y:MID-3},"COPY");
  add("text",{class:"m-s",x:X(1)+16,y:MID+16},"set into the rack");

  add("path",{class:"m-flow",d:"M"+(X(1)+COLW)+" "+MID+" H"+(X(2)-6),"marker-end":"url(#ar)"});
  add("rect",{class:"m-hub",x:X(2),y:MID-95,width:COLW,height:190,rx:8});
  add("text",{class:"m-big",x:X(2)+COLW/2,y:MID-24,"text-anchor":"middle"},"RACK");
  add("text",{class:"m-s",x:X(2)+COLW/2,y:MID+10,"text-anchor":"middle"},"build from any kit");
  add("text",{class:"m-s",x:X(2)+COLW/2,y:MID+30,"text-anchor":"middle"},"or your own samples");
  add("text",{class:"m-cap",x:X(2),y:74},"YOUR INSTRUMENT");

  add("path",{class:"m-flow",d:"M"+(X(2)+COLW)+" "+MID+" H"+(X(3)-6),"marker-end":"url(#ar)"});
  [["GROUP FX","per group"],["MASTER FX","on the sum"],["MIDI","learn anything"]]
  .forEach(([a,b],i)=>{
    const y=MID-85+i*80;
    add("rect",{class:"m-box",x:X(3),y:y,width:COLW,height:54,rx:6});
    add("text",{class:"m-t",x:X(3)+16,y:y+24},a);
    add("text",{class:"m-s",x:X(3)+16,y:y+42},b);
  });
  add("path",{class:"m-bus",d:"M"+(X(3)-6)+" "+MID+" H"+(X(3)-30)+" V"+(MID-58)+" H"+(X(3)-6)});
  add("path",{class:"m-bus",d:"M"+(X(3)-30)+" "+MID+" V"+(MID+22)+" H"+(X(3)-6)});
  add("text",{class:"m-cap",x:X(3),y:74},"TREATMENT");

  add("path",{class:"m-flow",d:"M"+(X(3)+COLW)+" "+MID+" H"+(X(4)-6),"marker-end":"url(#ar)"});
  add("rect",{class:"m-hub",x:X(4),y:MID-95,width:COLW,height:190,rx:8});
  add("text",{class:"m-big",x:X(4)+COLW/2,y:MID-24,"text-anchor":"middle"},"LIVE");
  add("text",{class:"m-s",x:X(4)+COLW/2,y:MID+10,"text-anchor":"middle"},"play the groups");
  add("text",{class:"m-cap",x:X(4),y:74},"PERFORM");

  const aY=MID+150;
  add("rect",{class:"m-dash",x:X(2),y:aY,width:X(4)+COLW-X(2),height:70,rx:8});
  add("text",{class:"m-cap",x:X(2)+16,y:aY+22},"AUDIOTOOL");
  const aMid=(X(2)+X(4)+COLW)/2;                                              // two columns inside the box, both flush left
  add("text",{class:"m-t",x:X(2)+16,y:aY+48},"EXPORT");
  add("text",{class:"m-s",x:X(2)+120,y:aY+48},"one-shots and loops out");
  add("text",{class:"m-t",x:aMid,y:aY+48},"IMPORT");
  add("text",{class:"m-s",x:aMid+104,y:aY+48},"loops from the timeline");
  add("path",{class:"m-flow",d:"M"+(X(2)+COLW/2)+" "+(MID+95)+" V"+(aY-6),"marker-end":"url(#ar)"});
  add("path",{class:"m-flow",d:"M"+(X(4)+COLW/2)+" "+aY+" V"+(MID+101),"marker-end":"url(#ar)"});

  box.appendChild(svg);
  return box;
}

const setter=document.getElementById("setter");
const setMode=on=>{ setting=on; setter.hidden=!on;
  document.querySelectorAll(".mid").forEach(m=>m.classList.toggle("setting",on)); };
addEventListener("keydown",e=>{
  if(e.key==="s"&&!/input|textarea/i.test(e.target.tagName))setMode(!setting);
  if(e.key==="Escape"&&setting)setMode(false);
});
document.getElementById("copyOut").onclick=()=>{
  const b=document.getElementById("out"); b.select(); document.execCommand("copy"); };
document.getElementById("clearOut").onclick=()=>{ document.getElementById("out").value=""; };
document.getElementById("closeSet").onclick=()=>setMode(false);
</script>
</body>
</html>
